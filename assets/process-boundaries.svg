<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-labelledby="t"><title id="t">Electron process boundaries</title><rect width="820" height="260" rx="16" fill="#f7f9fc"/><g font-family="Arial" text-anchor="middle"><rect x="35" y="65" width="205" height="130" rx="12" fill="#dce8f0" stroke="#58758d"/><rect x="307" y="65" width="205" height="130" rx="12" fill="#dce8f0" stroke="#58758d"/><rect x="580" y="65" width="205" height="130" rx="12" fill="#dce8f0" stroke="#58758d"/><g fill="#1e3b54" font-size="16"><text x="137" y="108">Renderer</text><text x="137" y="132" font-size="13">UI only</text><text x="409" y="108">Preload</text><text x="409" y="132" font-size="13">Narrow bridge</text><text x="682" y="108">Main process</text><text x="682" y="132" font-size="13">Privileged APIs</text></g><g stroke="#53728b" stroke-width="3" fill="none"><path d="M240 130h67m-10-8 10 8-10 8M512 130h68m-10-8 10 8-10 8"/></g><text x="410" y="35" fill="#1e3b54" font-size="17" font-weight="bold">Explicit, validated IPC only</text><text x="410" y="225" fill="#9b3030" font-size="13">Do not expose raw Node.js or unrestricted IPC to the renderer</text></g></svg>